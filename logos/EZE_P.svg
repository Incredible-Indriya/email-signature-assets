<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Definitions for reusable complex shapes -->
  <defs>
    <!-- Custom geometric 'e' constructed from outer and inner arcs -->
    <path id="letter-e" d="M -71.44 -36
             A 80 80 0 0 1 79.10 -12
             A 80 80 0 0 1 79.10 12
             L -54.70 12
             A 56 56 0 0 0 42.90 36
             L 71.44 36
             A 80 80 0 0 1 -79.10 12
             A 80 80 0 0 1 -79.10 -12
             L 54.70 -12
             A 56 56 0 0 0 -42.90 -36 Z" />
  </defs>

  <!-- White background to match the original image -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Logo Group -->
  <g fill="#313131">
    <!-- First 'e' -->
    <use href="#letter-e" x="230" y="400" />

    <!-- Center 'z' mapped via exact polygon coordinates -->
    <polygon points="335,320 465,320 380,456 465,456 465,480 335,480 420,344 335,344" />

    <!-- Second 'e' -->
    <use href="#letter-e" x="570" y="400" />
  </g>

  <!-- Subtext -->
  <text x="400" y="565" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="18" text-anchor="middle" fill="#313131">PERFUME</text>
</svg>
